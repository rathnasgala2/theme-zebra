name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (format, lint, conformance, digest, SBOM, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WORKSPACE_ROOT: ${{ github.workspace }}
      GALA_THEME_TOOLING_DIR: ${{ github.workspace }}/theme-tooling
    steps:
      - name: Check out this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Pinned to the commit tagged @rathnasgala2/template 2.1.0 (unreleased)
      # (not yet published to the registry; see the template's own
      # CHANGELOG.md Unreleased section, recommended release 2.1.0).
      # `css:check`/`grammar:check` and the template-conformance tests read
      # this checkout by path (WORKSPACE_ROOT/template).
      - name: Check out the template sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/template
          ref: 20f8fdefe822f264f9d7fdd787d0d58431930a0b # 2.1.0
          path: template
          persist-credentials: false

      # Pinned to a commit of the shared tooling every @rathnasgala2/theme-*
      # repository depends on (THD-M6). Not yet published to the registry
      # (owner decision) — see theme-tooling/README.md "Status: not yet
      # published" — so it is resolved by path via GALA_THEME_TOOLING_DIR,
      # exactly like the template sibling above.
      - name: Check out the theme-tooling sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/theme-tooling
          ref: 4d36e4a4b0e8e03033356c9dcbe4cf41d07a56f2 # 0.2.0
          path: theme-tooling
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: theme-tooling/package-lock.json

      - name: Verify toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install the template sibling repository's dependencies
        working-directory: template
        run: npm ci

      - name: Install the shared tooling's dependencies
        working-directory: theme-tooling
        run: npm ci

      - name: Run the complete verify gate
        working-directory: tooling
        run: npm run verify

      - name: Check gitleaks fragment drift (infra sibling optional)
        working-directory: tooling
        run: npm run workflows:drift

  visual:
    name: Visual/accessibility check (Playwright + axe-core)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WORKSPACE_ROOT: ${{ github.workspace }}
      GALA_TEMPLATE_DIR: ${{ github.workspace }}/template
      GALA_THEME_TOOLING_DIR: ${{ github.workspace }}/theme-tooling
    steps:
      - name: Check out this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out the template sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/template
          ref: 20f8fdefe822f264f9d7fdd787d0d58431930a0b # 2.1.0
          path: template
          persist-credentials: false

      - name: Check out the theme-tooling sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/theme-tooling
          ref: 4d36e4a4b0e8e03033356c9dcbe4cf41d07a56f2 # 0.2.0
          path: theme-tooling
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: theme-tooling/package-lock.json

      - name: Install the template sibling repository's dependencies
        working-directory: template
        run: npm ci

      - name: Install the shared tooling's dependencies
        working-directory: theme-tooling
        run: npm ci

      - name: Install the Chromium browser this check drives
        working-directory: theme-tooling
        run: npx playwright install --with-deps chromium

      - name: Run the visual/accessibility check
        working-directory: tooling
        run: npm run visual:check -- --out "${{ runner.temp }}/visual-check"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-check-screenshots
          path: ${{ runner.temp }}/visual-check
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GALA_THEME_TOOLING_DIR: ${{ github.workspace }}/theme-tooling
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out the theme-tooling sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/theme-tooling
          ref: 4d36e4a4b0e8e03033356c9dcbe4cf41d07a56f2 # 0.2.0
          path: theme-tooling
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: theme-tooling/package-lock.json
      - working-directory: theme-tooling
        run: npm ci
      - working-directory: tooling
        run: npm run audit

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the checksum-pinned Gitleaks binary
        shell: bash
        run: |
          install -d "${RUNNER_TEMP}/gitleaks"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "${RUNNER_TEMP}/gitleaks/gitleaks.tar.gz"
          cd "${RUNNER_TEMP}/gitleaks"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            'gitleaks.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks

      - name: Scan repository history for secrets
        run: >-
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner
          --log-opts="--all" .
