name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - working-directory: tooling
        run: npm ci
      - working-directory: tooling
        run: npm run format:check
      - working-directory: tooling
        run: npm run lint

  structural:
    name: Structural checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
      - working-directory: tooling
        run: npm ci
      - working-directory: tooling
        run: npm run schema:check
      - working-directory: tooling
        run: npm run package:check
      - working-directory: tooling
        run: npm run schema-pin:check
      - working-directory: tooling
        run: npm run digest:generate
      - working-directory: tooling
        run: npm run digest:check
      - working-directory: tooling
        run: npm run workflows:check
      - working-directory: tooling
        run: npm run workflows:drift

  conformance:
    name: Unit tests and template conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # PLACEHOLDER (W0-01): ref is provisional until the template
      # repository exists on GitHub with a frozen contract revision to
      # pin to. `tooling/scripts/check-css-hooks.mjs` and the conformance
      # tests read this checkout by path (WORKSPACE_ROOT/template).
      - name: Check out the template sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/template
          ref: main # PLACEHOLDER (W0-01): pin to a frozen release tag
          path: template
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tooling/package-lock.json

      - name: Install the template sibling repository's dependencies
        working-directory: template
        run: npm ci

      - name: Install locked dependencies
        working-directory: tooling
        run: npm ci

      - working-directory: tooling
        run: npm run css:check

      - working-directory: tooling
        run: npm run absence:check

      - working-directory: tooling
        run: npm test
