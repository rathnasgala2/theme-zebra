name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - working-directory: tooling
        run: npm ci
      - working-directory: tooling
        run: npm run format:check
      - working-directory: tooling
        run: npm run lint

  structural:
    name: Structural checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
      - working-directory: tooling
        run: npm ci
      - working-directory: tooling
        run: npm run schema:check
      - working-directory: tooling
        run: npm run contrast:check
      - working-directory: tooling
        run: npm run package:check
      - working-directory: tooling
        run: npm run schema-pin:check
      - working-directory: tooling
        run: npm run workflows:check
      - working-directory: tooling
        run: npm run workflows:drift

  conformance:
    name: Unit tests and template conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Pinned to the commit published as @rathnasgala2/template 2.0.0
      # (verified against the registry's gitHead metadata for that version).
      # `tooling/scripts/check-css-hooks.mjs` and the conformance
      # tests read this checkout by path (WORKSPACE_ROOT/template).
      - name: Check out the template sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/template
          ref: 15142f8baebaff5e174ac07d784073d2d2163b88 # 2.0.0
          path: template
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tooling/package-lock.json

      - name: Install the template sibling repository's dependencies
        working-directory: template
        run: npm ci

      - name: Install locked dependencies
        working-directory: tooling
        run: npm ci

      # The digest cycle regenerates theme.json's conformance evidence
      # against the template checkout, so it belongs in the job that has
      # that sibling on disk.
      - working-directory: tooling
        run: npm run digest:generate
      - working-directory: tooling
        run: npm run digest:check

      - working-directory: tooling
        run: npm run css:check

      - working-directory: tooling
        run: npm run absence:check

      - working-directory: tooling
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - working-directory: tooling
        run: npm ci
      - working-directory: tooling
        run: npm run audit

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the checksum-pinned Gitleaks binary
        shell: bash
        run: |
          install -d "${RUNNER_TEMP}/gitleaks"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "${RUNNER_TEMP}/gitleaks/gitleaks.tar.gz"
          cd "${RUNNER_TEMP}/gitleaks"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            'gitleaks.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks

      - name: Scan repository history for secrets
        run: >-
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner
          --log-opts="--all" .
