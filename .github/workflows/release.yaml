name: Release

# The only workflow in this repository that publishes to npm. It uses npm
# trusted publishing: `environment: npm`, `id-token: write`, provenance, and
# no NPM_TOKEN secret. It reads the package name and version from package.json,
# so the six theme repositories carry this file byte for byte.
#
# A release is: bump package.json's version, add the CHANGELOG.md heading for
# it, push to main. A push that changes a packed path (LICENSE, README.md,
# components.css, package.json, print.css, theme.json or tokens.css) of a
# package whose declared version is already on npm FAILS; it never skips
# silently, and it publishes nothing from that push. A version that is not
# newer than the newest one on npm is refused too. Before anything is published
# the complete theme gate must pass once. A manual run (workflow_dispatch)
# retries a version that is not on npm yet, e.g. after the trusted publisher was
# registered late; dispatching a version that is already published fails.
#
# One-time owner setup on npmjs.com, per package (Settings > Trusted publishing
# > GitHub Actions): owner rathnasgala2, this repository, workflow filename
# release.yaml, environment npm.

on:
  push:
    branches:
      - main
    paths:
      - LICENSE
      - README.md
      - components.css
      - package.json
      - print.css
      - theme.json
      - tokens.css
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish the declared package version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      WORKSPACE_ROOT: ${{ github.workspace }}
      GALA_THEME_TOOLING_DIR: ${{ github.workspace }}/theme-tooling
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # See ci.yml for why this is a pinned sibling checkout rather than an
      # npm dependency (THD-M6; not yet published, owner decision).
      - name: Check out the theme-tooling sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/theme-tooling
          ref: 5f3ad8e31d48c2c715ab42b4ee9916c0ec8e6379 # 0.7.0
          path: theme-tooling
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: theme-tooling/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Read the declared package identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")"
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          echo "name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

      # Runs before anything is installed and before the gate. Fails the run
      # (THD-H5) when the declared version is already on npm, or is not newer
      # than the newest plain x.y.z version on npm. The registry is read with
      # `npm view <name> versions --json`, stdout and stderr kept apart: only
      # an E404 document means "never published"; any other failure stops the
      # run instead of reading as "new". Runs after any wait behind an earlier
      # run (the concurrency group above), so it sees what that run published.
      - name: Fail unless this version is new on npm
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.identity.outputs.name }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          PACKED_PATHS:
            LICENSE, README.md, components.css, package.json, print.css,
            theme.json or tokens.css
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases run from main only; this run is on ${GITHUB_REF}." >&2
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import { spawnSync } from 'node:child_process';

          const {
            PACKAGE_NAME: name,
            PACKAGE_VERSION: version,
            EVENT_NAME: event,
            PACKED_PATHS: packed,
          } = process.env;
          const fail = (message) => {
            console.log(
              `::error::${message.replaceAll('%', '%25').replaceAll('\n', '%0A')}`,
            );
            process.exit(1);
          };
          const triple = (text) =>
            /^(\d+)\.(\d+)\.(\d+)$/u.exec(text)?.slice(1).map(Number) ?? null;
          const compare = (left, right) =>
            left[0] - right[0] || left[1] - right[1] || left[2] - right[2];
          const declared = triple(version);
          if (declared === null) {
            fail(
              `${name} declares version ${JSON.stringify(version)}, which is not a plain x.y.z version.`,
            );
          }
          const view = spawnSync('npm', ['view', name, 'versions', '--json'], {
            encoding: 'utf8',
            maxBuffer: 64 * 1024 * 1024,
          });
          let answer;
          try {
            answer = JSON.parse(view.stdout);
          } catch {
            fail(
              `npm view exited ${view.status} without a JSON answer: ${view.stderr.trim() || view.stdout.trim() || 'no output'}`,
            );
          }
          let listed;
          if (view.status === 0) {
            listed = typeof answer === 'string' ? [answer] : answer;
            if (
              !Array.isArray(listed) ||
              !listed.every((entry) => typeof entry === 'string')
            ) {
              fail('npm view returned something other than a version list.');
            }
          } else if (answer?.error?.code === 'E404') {
            listed = [];
          } else {
            fail(
              `npm view failed with ${answer?.error?.code ?? `exit ${view.status}`}: ${view.stderr.trim() || JSON.stringify(answer)}`,
            );
          }
          const bumpWhat =
            "package.json's version (and add a dated CHANGELOG.md heading)";
          if (listed.includes(version)) {
            fail(
              event === 'push'
                ? `${name}@${version} is already published, but this run was triggered by a push that touched a packed path (${packed}). Bump ${bumpWhat} before pushing a change to a packed path.`
                : `${name}@${version} is already published, so a manual run has nothing to release. Dispatch this workflow only to retry a version that is not on npm yet; to release new content, bump ${bumpWhat} and push to main.`,
            );
          }
          let newest = null;
          for (const text of listed) {
            const candidate = triple(text);
            if (
              candidate !== null &&
              (newest === null || compare(candidate, newest.triple) > 0)
            ) {
              newest = { text, triple: candidate };
            }
          }
          if (newest !== null && compare(declared, newest.triple) <= 0) {
            fail(
              `${name}@${version} is not newer than the newest published version ${newest.text}. Bump ${bumpWhat} past it.`,
            );
          }
          console.log(
            `${name}@${version} is not on npm yet${newest === null ? '' : ` and is newer than the newest published version ${newest.text}`}.`,
          );
          NODE

      - name: Check the CHANGELOG has an entry for this version
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -qE "^## ${PACKAGE_VERSION//./\\.}( - |\$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${PACKAGE_VERSION} - <date>' heading; add one before publishing." >&2
            exit 1
          fi

      - name: Install the shared tooling's dependencies
        working-directory: theme-tooling
        run: npm ci --ignore-scripts

      - name: Run the complete release gate
        working-directory: tooling
        run: npm run verify

      # THD-H4: the release gate must never publish anything other than
      # exactly the reviewed commit's bytes. `digest:generate` is no
      # longer part of `verify` (THD-H2), but this still catches any other
      # accidental working-tree mutation before it can reach `npm publish`.
      - name: Fail if verify mutated the working tree
        run: git diff --exit-code

      # THD-M6: the theme's SBOM is not committed (it depends on nothing
      # but this commit's own package.json identity, so committing it
      # would only be another copy of information already in git) —
      # generated fresh here and attached to this release as a build
      # artifact instead.
      - name: Generate the release SBOM
        working-directory: tooling
        run: npm run sbom:generate -- --out "${{ github.workspace }}/dist/sbom.cdx.json"

      - name: Upload the release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom.cdx.json
          path: dist/sbom.cdx.json
          retention-days: 90

      # The reviewed bytes, kept as a build artifact beside the registry copy;
      # their digest is compared with the registry's copy after publishing.
      - name: Build the package artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --pack-destination dist --ignore-scripts --silent | tail -n 1)"
          pack_sha256="$(sha256sum "dist/${tarball}" | cut -d ' ' -f 1)"
          echo "sha256=${pack_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme-package-${{ github.sha }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 90

      - name: Verify the package payload
        run: npm pack --dry-run --ignore-scripts

      # THD-H6: exercised on every push, not only discovered for the first
      # time on the first real release. `--dry-run` performs every
      # provenance precondition check (including deriving the source
      # repository from package.json.repository) without publishing.
      - name: Verify provenance can be generated
        run: npm publish --access public --provenance --dry-run --ignore-scripts

      # The first publish of a package needs the owner's npm trusted-publisher
      # registration. Without it this step must fail loudly, never skip.
      - name: Publish with trusted provenance
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.identity.outputs.name }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          if ! npm publish --access public --provenance --ignore-scripts; then
            echo "::error::npm publish failed for ${PACKAGE_NAME}@${PACKAGE_VERSION}. If ${PACKAGE_NAME} has no npm trusted publisher yet, the owner must register it on npmjs.com (Settings > Trusted publishing > GitHub Actions): owner rathnasgala2, repository ${GITHUB_REPOSITORY#*/}, workflow filename release.yaml, environment npm, Allow npm publish. Then dispatch this workflow." >&2
            exit 1
          fi

      - name: Wait until the registry lists the version
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.identity.outputs.name }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is listed."
              exit 0
            fi
            echo "Waiting for the registry to list ${PACKAGE_NAME}@${PACKAGE_VERSION} (attempt ${attempt} of 20)."
            if [ "${attempt}" -lt 20 ]; then
              sleep 30
            fi
          done
          echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} was published but is still not listed after 10 minutes. Check npmjs.com; do not publish it again." >&2
          exit 1

      # Print the registry's digest and refuse a mismatch with the reviewed
      # bytes.
      - name: Record the registry digest
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.identity.outputs.name }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
          LOCAL_SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          url="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.tarball)"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/registry.tgz" "${url}"
          registry_sha256="$(sha256sum "${RUNNER_TEMP}/registry.tgz" | cut -d ' ' -f 1)"
          {
            echo "### ${PACKAGE_NAME}@${PACKAGE_VERSION} published"
            echo
            echo "Registry tarball sha256: \`${registry_sha256}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${registry_sha256}" != "${LOCAL_SHA256}" ]; then
            echo "::error::The registry tarball for ${PACKAGE_NAME}@${PACKAGE_VERSION} has sha256 ${registry_sha256}, but the reviewed pack was ${LOCAL_SHA256}. Do not pin this release until the difference is understood." >&2
            exit 1
          fi
          echo "Registry digest equals the reviewed pack: ${registry_sha256}"
