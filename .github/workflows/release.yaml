name: Release

on:
  push:
    branches:
      - main
    paths:
      - components.css
      - print.css
      - theme.json
      - tokens.css
      - package.json
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish the declared package version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      WORKSPACE_ROOT: ${{ github.workspace }}
      GALA_THEME_TOOLING_DIR: ${{ github.workspace }}/theme-tooling
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned to the commit published as @rathnasgala2/template 2.0.0
      # (verified against the registry's gitHead metadata for that version).
      # `css:check`/`grammar:check` read this checkout by path
      # (WORKSPACE_ROOT/template) for the S2-T12 theme-styling hook
      # contract, so `npm run verify` needs it present in CI.
      - name: Check out the template sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/template
          ref: 15142f8baebaff5e174ac07d784073d2d2163b88 # 2.0.0
          path: template
          persist-credentials: false

      # See ci.yml for why this is a pinned sibling checkout rather than an
      # npm dependency (THD-M6; not yet published, owner decision).
      - name: Check out the theme-tooling sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/theme-tooling
          ref: 2e3142bad84530377288038badc67ad3de2482b1 # 0.1.0 (unpublished)
          path: theme-tooling
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: theme-tooling/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install the template sibling repository's dependencies
        working-directory: template
        run: npm ci

      - name: Install the shared tooling's dependencies
        working-directory: theme-tooling
        run: npm ci

      - name: Fail if this version is already published (THD-H5)
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node --input-type=module -e "import definition from './package.json' with {type: 'json'}; process.stdout.write(definition.name)")"
          package_version="$(node --input-type=module -e "import definition from './package.json' with {type: 'json'}; process.stdout.write(definition.version)")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "::error::${package_name}@${package_version} is already published. Bump package.json's version (and add a dated CHANGELOG.md heading) before pushing a change to a packed path." >&2
            exit 1
          fi

      - name: Run the complete release gate
        working-directory: tooling
        run: npm run verify

      # THD-H4: the release gate must never publish anything other than
      # exactly the reviewed commit's bytes. `digest:generate` is no
      # longer part of `verify` (THD-H2), but this still catches any other
      # accidental working-tree mutation before it can reach `npm publish`.
      - name: Fail if verify mutated the working tree
        run: git diff --exit-code

      - name: Verify the package payload
        run: npm pack --dry-run

      # THD-H6: exercised on every push, not only discovered for the first
      # time on the first real release. `--dry-run` performs every
      # provenance precondition check (including deriving the source
      # repository from package.json.repository) without publishing.
      - name: Verify provenance can be generated
        run: npm publish --access public --provenance --dry-run

      - name: Publish with trusted provenance
        run: npm publish --access public --provenance
