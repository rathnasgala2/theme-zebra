name: Release

on:
  push:
    branches:
      - main
    paths:
      - components.css
      - print.css
      - theme.json
      - tokens.css
      - package.json
      - package-lock.json
      - tooling/package-lock.json
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish the declared package version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned to the commit published as @rathnasgala2/template 2.0.0
      # (verified against the registry's gitHead metadata for that version).
      # `tooling/scripts/check-css-hooks.mjs` reads this checkout
      # by path (WORKSPACE_ROOT/template) for the S2-T12 theme-styling
      # hook contract, so `npm run verify` needs it present in CI.
      - name: Check out the template sibling repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rathnasgala2/template
          ref: 15142f8baebaff5e174ac07d784073d2d2163b88 # 2.0.0
          path: template
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tooling/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        working-directory: tooling
        run: npm ci

      - name: Run the complete release gate
        working-directory: tooling
        run: npm run verify

      - name: Verify the package payload
        run: npm pack --dry-run

      - name: Publish with trusted provenance
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node --input-type=module -e "import definition from './package.json' with {type: 'json'}; process.stdout.write(definition.name)")"
          package_version="$(node --input-type=module -e "import definition from './package.json' with {type: 'json'}; process.stdout.write(definition.version)")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published, skipping."
            exit 0
          fi
          npm publish --access public --provenance
